# Add this INSIDE the existing `server {}` block serving HTTPS for srun.ir.
# Do not overwrite the existing vhost or unrelated routes.
location = /hokmnameh { return 308 /hokmnameh/; }
location ^~ /hokmnameh/ {
    proxy_pass http://127.0.0.1:5080;  # no trailing / ; preserve /hokmnameh prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    client_max_body_size 64k;
}
