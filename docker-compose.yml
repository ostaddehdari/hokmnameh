name: hokmnameh
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hokmnameh}
      POSTGRES_USER: ${POSTGRES_USER:-hokm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 requires mounting the *parent* of the versioned PGDATA directory.
      - pgdata:/var/lib/postgresql
      - ./backend/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    image: ${HOKM_API_IMAGE:-hokmnameh-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hokmnameh};Username=${POSTGRES_USER:-hokm_app};Password=${POSTGRES_PASSWORD}"
      Hokm__TurnSeconds: "30"
      Hokm__AuditKeyBase64: ${HOKM_AUDIT_KEY_BASE64:-}
      Hokm__EnableSwagger: "true"
    ports: ["127.0.0.1:5080:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    networks: [internal, edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  internal:
    internal: true
  edge:
    driver: bridge
volumes:
  pgdata:
