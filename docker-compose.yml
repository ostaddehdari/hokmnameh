name: hokmnameh
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hokmnameh}
      POSTGRES_USER: ${POSTGRES_USER:-hokm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [internal]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hokmnameh};Username=${POSTGRES_USER:-hokm_app};Password=${POSTGRES_PASSWORD}"
      Hokm__TurnSeconds: "30"
    ports:
      - "127.0.0.1:5080:8080"
    security_opt:
      - no-new-privileges:true
    networks: [internal]
networks:
  internal:
volumes:
  pgdata:
