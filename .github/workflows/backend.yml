name: Hokmnameh CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hokm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repo:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and JSON
        run: |
          set -euo pipefail
          find deploy/scripts -maxdepth 1 -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m json.tool global.json >/dev/null
          python3 -m json.tool docs/ruleset_hokm_classic_v1.json >/dev/null
          python3 -m json.tool docs/ruleset_hokm_classic_v1.golden.json >/dev/null
          node docs/verify-ruleset-classic-v1.mjs
          python3 -m json.tool docs/product_domains_v1.json >/dev/null
          node docs/verify-product-domains-v1.mjs
          python3 -m json.tool docs/e04_decision_set_v1.json >/dev/null
          python3 -m json.tool docs/e04_test_vector_v1.json >/dev/null
          node docs/verify-e04-decision-v1.mjs
          node 0000/change-control/verify-change-control.mjs --self-test
          python3 -m json.tool docs/planning/backlog.json >/dev/null
          python3 -m json.tool repository.contract.json >/dev/null
          python3 -m json.tool version-contract.json >/dev/null
          node tools/verify-repository-contract.mjs
          python3 -m json.tool deploy/security-contract.json >/dev/null
          node tools/verify-vps-security-contract.mjs
          python3 -m json.tool backend/db/migrations/manifest.json >/dev/null
          python3 -m json.tool deploy/operations-contract.json >/dev/null
          node tools/verify-s01-operations.mjs
          node tools/test-health-monitor.mjs
          git diff --check
      - name: Confirm no tracked local env file
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|.*\.pem|.*\.pfx)$'; then
            echo 'Sensitive local file is tracked' >&2
            exit 1
          fi

  core-and-api:
    name: .NET 10 build and shared rules smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Lint and build solution with warnings as errors
        run: dotnet build Hokmnameh.sln -c Release -warnaserror -p:ContinuousIntegrationBuild=true
      - name: Shared rules smoke
        run: dotnet run --project backend/tests/Hokmnameh.SmokeTests/Hokmnameh.SmokeTests.csproj -c Release

  database-migrations:
    name: PostgreSQL migration contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL (no API)
        run: |
          set -euo pipefail
          printf 'POSTGRES_DB=hokmnameh_ci\nPOSTGRES_USER=hokm_ci\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          chmod 600 .env
          docker compose up -d postgres
          for i in $(seq 1 60); do
            if docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: Apply migration then verify idempotency
        run: |
          set -euo pipefail
          ./deploy/scripts/migrate.sh
          ./deploy/scripts/migrate.sh
          docker compose exec -T postgres sh -c \
            'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT count(*) FROM public.schema_migrations"' | grep -qx '1'
          docker compose exec -T postgres sh -c \
            'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT count(*) FROM public.accounts"' | grep -qx '0'
      - name: Reject an edited migration checksum
        run: |
          set -euo pipefail
          cp backend/db/migrations/001_core.sql "$RUNNER_TEMP/001_core.sql"
          trap 'cp "$RUNNER_TEMP/001_core.sql" backend/db/migrations/001_core.sql' EXIT
          printf '\n-- forbidden post-apply edit\n' >> backend/db/migrations/001_core.sql
          if ./deploy/scripts/migrate.sh >"$RUNNER_TEMP/tamper.log" 2>&1; then
            echo 'Edited applied migration was accepted' >&2
            exit 1
          fi
          grep -q 'Migration checksum mismatch' "$RUNNER_TEMP/tamper.log"
      - name: Clean up
        if: always()
        run: |
          docker compose down --remove-orphans || true
          rm -f .env

  docker-build:
    name: Build deployable API image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile -t hokmnameh-api:ci .
          test "$(docker image inspect -f '{{.Config.User}}' hokmnameh-api:ci)" = '10001:10001'

  operations-drill:
    name: Encrypted restore, rate limit and alert drill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
      - name: Start source PostgreSQL and apply migrations
        run: |
          set -euo pipefail
          printf 'POSTGRES_DB=hokmnameh_ci\nPOSTGRES_USER=hokm_ci\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          chmod 600 .env
          docker compose up -d --wait postgres
          ./deploy/scripts/migrate.sh
      - name: Create encrypted backup without plaintext on disk
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/hokm-age-key.txt" >/dev/null
          recipient="$(age-keygen -y "$RUNNER_TEMP/hokm-age-key.txt")"
          HOKM_BACKUP_DIR="$RUNNER_TEMP/hokm-backups" \
            HOKM_BACKUP_AGE_RECIPIENT="$recipient" ./deploy/scripts/backup.sh
      - name: Restore encrypted backup into a separate PostgreSQL
        run: |
          set -euo pipefail
          backup="$(find "$RUNNER_TEMP/hokm-backups" -maxdepth 1 -name '*.dump.age' -print -quit)"
          test -n "$backup"
          AGE_IDENTITY_FILE="$RUNNER_TEMP/hokm-age-key.txt" \
            ./deploy/scripts/restore-drill.sh "$backup" | tee "$RUNNER_TEMP/restore-drill.txt"
          grep -Eq '^RESTORE_DRILL PASS .*duration_seconds=[0-9]+ isolated=true$' "$RUNNER_TEMP/restore-drill.txt"
      - name: Start API and verify health
        run: |
          set -euo pipefail
          docker compose up -d --build api
          ./deploy/scripts/check.sh
      - name: Verify runtime rate limit
        run: |
          set -euo pipefail
          for request in $(seq 1 11); do
            status="$(curl --silent --show-error -D "$RUNNER_TEMP/rate-headers-$request" \
              -o "$RUNNER_TEMP/rate-body-$request" -w '%{http_code}' \
              -X POST http://127.0.0.1:5080/hokmnameh/api/v1/identity/guest)"
            if [ "$request" -le 10 ]; then
              [ "$status" = 201 ] || { echo "Request $request returned $status" >&2; exit 1; }
            else
              [ "$status" = 429 ] || { echo "Request 11 returned $status" >&2; exit 1; }
              grep -qi '^Retry-After:' "$RUNNER_TEMP/rate-headers-$request"
            fi
          done
      - name: Verify health alert delivery
        run: node tools/test-health-monitor.mjs
      - name: Clean up operations drill
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env "$RUNNER_TEMP/hokm-age-key.txt"
          rm -rf "$RUNNER_TEMP/hokm-backups"

# Deployment is deliberately NOT triggered by push or pull_request.
# Production requires a separately authorized operator, backup, and verified VPS access.
